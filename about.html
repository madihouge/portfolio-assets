<!DOCTYPE html>

  <link rel="stylesheet" href="css/work.css">
  <link rel="stylesheet" href="css/about.css">
</head>
<body class="page-about">

  <!-- =========================================================
       HEADER: logo (links home), navigation, social icons
       ========================================================= -->
  <header class="topbar">
    <a class="logo" href="index.html" aria-label="Madi Houge — home">

    <nav class="nav" aria-label="Main">
      <ul class="nav__links">
        <li><a href="work.html">work</a></li>
        <li><a href="about.html" aria-current="page">about</a></li>
        <!-- TODO: change href to "contact.html" once the Contact page exists -->
        <li><a href="#" data-future-page="contact">contact</a></li>
      </ul>
    </nav>

    <!-- Social icons (TODO: add real profile URLs in the href attributes) -->
    <ul class="social">
      <li>
        <a href="#" data-social="instagram" aria-label="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect class="box" x="1" y="1" width="22" height="22" rx="5"/><rect class="line" x="5" y="5" width="14" height="14" rx="4"/><circle class="line" cx="12" cy="12" r="3.3"/><circle class="dot" cx="16.1" cy="7.9" r="0.95"/></svg>
        </a>
      </li>
      <li>
        <a href="#" data-social="linkedin" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect class="box" x="1" y="1" width="22" height="22" rx="5"/><path class="line" d="M7.6 10.4v6.6M7.6 7v.2M11.4 17v-6.6m0 3c0-1.8 1.1-3.1 2.7-3.1s2.4 1.1 2.4 2.9V17"/></svg>
        </a>
      </li>
    </ul>
  </header>

  <!-- =========================================================
       PROJECTS
       To swap a photo, change the src of its first <img>.
       On hover each tile fades to <folder>/hover.png (skipped until that
       file exists) and shows its label, same as the homepage.
       --pos sets which part of the photo shows in the tile.
       TODO: create the project pages these links point to.
       ========================================================= -->
    <!-- =========================================================
       ABOUT HERO — recreated from about/about - hero.png.
       Every piece is placed with --x / --y (left / top) and --w (width)
       in the reference's 1665px-wide frame, so it all scales together.
       ========================================================= -->
  <main class="about">
    <h1 class="visually-hidden">About Madi Houge</h1>

    <div class="about__stage">
        <img class="art art--squiggle" style="--x:72.4; --y:-5.5; --w:1523.5" src="https://raw.githubusercontent.com/madihouge/portfolio-assets/main/about/squiggle.png" alt="" aria-hidden="true">

        <!-- Photo in a circle -->
        <div class="portrait">
          <img src="https://raw.githubusercontent.com/madihouge/portfolio-assets/main/about/me.JPG" alt="Madi Houge smiling, wearing a burgundy top">
        </div>

        <img class="art" style="--x:994; --y:94; --w:254.9" src="https://raw.githubusercontent.com/madihouge/portfolio-assets/main/about/color-swatch.png" alt="Color swatch fan">
        <img class="art" style="--x:1240; --y:81; --w:283.9; --r:2" src="https://raw.githubusercontent.com/madihouge/portfolio-assets/main/about/camera.png" alt="Camera">
        <img class="art" style="--x:973; --y:311; --w:368.1" src="https://raw.githubusercontent.com/madihouge/portfolio-assets/main/about/backpack.png" alt="Backpack with water bottle">
        <img class="art" style="--x:1262; --y:446; --w:312.7" src="https://raw.githubusercontent.com/madihouge/portfolio-assets/main/about/books.png" alt="Stack of books">
        <img class="art" style="--x:1293; --y:246; --w:256.4; --r:6" src="https://raw.githubusercontent.com/madihouge/portfolio-assets/main/about/design.png" alt="design, illustrate, create, print">
        <img class="art" style="--x:1173; --y:216; --w:131.8" src="https://raw.githubusercontent.com/madihouge/portfolio-assets/main/about/star.png" alt="" aria-hidden="true">
        <img class="art" style="--x:422; --y:83; --w:256.7" src="https://raw.githubusercontent.com/madihouge/portfolio-assets/main/about/shipping-box.png" alt="Shipping box">
        <img class="art" style="--x:109.7; --y:293; --w:308" src="https://raw.githubusercontent.com/madihouge/portfolio-assets/main/about/sketchbooks.png" alt="Sketchbook">
        <img class="art" style="--x:128; --y:95; --w:331.3; --r:-2" src="https://raw.githubusercontent.com/madihouge/portfolio-assets/main/about/branding.png" alt="branding, packaging, illustration">
        <img class="art" style="--x:326; --y:381; --w:344; --r:-4" src="https://raw.githubusercontent.com/madihouge/portfolio-assets/main/about/watercolor.png" alt="Watercolor palette">
        <img class="art" style="--x:310; --y:307; --w:199.7" src="https://raw.githubusercontent.com/madihouge/portfolio-assets/main/about/pencil.png" alt="Pencil">
        <img class="art" style="--x:138; --y:470.4; --w:217.9; --r:2" src="https://raw.githubusercontent.com/madihouge/portfolio-assets/main/about/mug.png" alt="Mug">
        <img class="art" style="--x:340; --y:33; --w:127.2" src="https://raw.githubusercontent.com/madihouge/portfolio-assets/main/about/star.png" alt="" aria-hidden="true">
        <img class="art" style="--x:589; --y:-5; --w:501" src="https://raw.githubusercontent.com/madihouge/portfolio-assets/main/about/madi_houge%20Badge.png" alt="@madi_houge">
        <img class="art art--toolbar" style="--x:112.8; --y:431.9; --w:1427.7" src="https://raw.githubusercontent.com/madihouge/portfolio-assets/main/about/toolbar.png" alt="Design software toolbar">

        <!-- Bio speech bubble: shape drawn in CSS to match the reference;
             the text is live and editable -->
        <div class="bio">
          <p class="bio__text">
            <span class="bio__line">I’m Madi — a graphic designer focused on branding, packaging,</span>
            <span class="bio__line">and illustration. I create bold, thoughtful visuals inspired by the outdoors,</span>
            <span class="bio__line">everyday moments, and the little details that make life fun.</span>
          </p>
        </div>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
